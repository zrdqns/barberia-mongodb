spring.application.name=api-citas
server.port=8082

# Chrome envía en cada petición las cookies de todos los proyectos que hayan corrido en
# localhost. Con el límite por defecto (8 KB) Tomcat puede rechazarlas con un 400.
server.max-http-request-header-size=64KB

# Las dos interfaces web autorizadas a consumir esta API (CORS): agenda y catálogo
frontend.url=http://localhost:5174,http://localhost:5175

# Dirección del microservicio de catálogo que esta API consume
api.catalogo.url=http://localhost:8083
# Cuánto espera la respuesta del otro microservicio
api.timeout=5s

# MongoDB local, base barberia_citas (colecciones clientes, citas y horario).
# En Spring Boot 4 la propiedad es spring.mongodb.uri (antes spring.data.mongodb.uri).
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/barberia_citas}
# Crea los índices declarados con @Indexed (documento único del cliente, fecha de la cita)
spring.data.mongodb.auto-index-creation=true

# JWT: clave con la que se firman y validan los tokens (la misma en los dos microservicios,
# mínimo 32 caracteres) y cuánto dura cada uno. Fuera de este entorno local se cambia con JWT_SECRETO.
jwt.secreto=${JWT_SECRETO:barberia-el-remolino-clave-local-de-desarrollo}
jwt.duracion=8h
